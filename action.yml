name: 'Python Custom Greeter'
description: 'A sample custom GitHub Action written in Python'
inputs:
  user_name:
    description: 'The name of the person to greet'
    required: true
    default: 'Developer'
outputs:
  status_message:
    description: 'The final status message'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      shell: bash
      run: |
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

    - name: Run Python Script
      shell: bash
      env:
        INPUT_USER_NAME: ${{ inputs.user_name }}
      run: python ${{ github.action_path }}/main.py

